<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Admin — UnlimitedWeb</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css" />
    <script type="module" src="./admin.js"></script>
  </head>
  <body>
    <div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div>

    <header class="appbar">
      <div class="appbar__bar">
        <a class="logo" href="./index.html" aria-label="Wróć do huba">
          <svg class="logo__svg" viewBox="0 0 40 40" aria-hidden="true">
            <path d="M6 3.5 30.5 20 6 36.5Z" fill="#01875f" />
            <path d="M30.5 20 36.6 16.6c1.1.6 1.1 2.2 0 2.8Z" fill="#ffce00" />
          </svg>
          <span class="logo__name">UnlimitedWeb · Admin</span>
        </a>
        <div class="appbar__actions">
          <a class="gicon" href="./index.html" aria-label="Hub" title="Hub">
            <span class="material-icons" aria-hidden="true">apps</span>
          </a>
          <button class="gicon" id="theme-toggle" type="button" aria-label="Zmień motyw">
            <span class="material-icons" aria-hidden="true">brightness_6</span>
          </button>
        </div>
      </div>
    </header>

    <div class="wrap">
      <section class="panel glass" id="auth-panel">
        <h1 class="panel__title">Zaloguj się</h1>
        <p class="panel__sub">Panel admina — dodawanie projektów do huba.</p>
        <form id="login-form">
          <div class="field">
            <label for="email">E-mail</label>
            <input id="email" type="email" autocomplete="username" required />
          </div>
          <div class="field">
            <label for="password">Hasło</label>
            <input id="password" type="password" autocomplete="current-password" required />
          </div>
          <button class="btn" type="submit" id="login-btn">Zaloguj</button>
        </form>
        <p class="note" id="auth-note" role="status" aria-live="polite"></p>
      </section>

      <section class="panel glass" id="add-panel" hidden>
        <div style="display: flex; justify-content: space-between; align-items: start; gap: 12px">
          <div>
            <h1 class="panel__title">Dodaj projekt</h1>
            <p class="panel__sub" id="who"></p>
          </div>
          <button class="btn btn--ghost" type="button" id="logout-btn">Wyloguj</button>
        </div>

        <form id="add-form">
          <div class="field">
            <label for="name">Nazwa *</label>
            <input id="name" name="name" required placeholder="np. SuperNotes" />
          </div>
          <div class="row2">
            <div class="field">
              <label for="category">Kategoria</label>
              <select id="category" name="category">
                <option value="app">Aplikacja</option>
                <option value="game">Gra</option>
                <option value="tool">Narzędzie</option>
                <option value="site">Strona</option>
              </select>
            </div>
            <div class="field">
              <label for="accent">Kolor akcentu</label>
              <input id="accent" name="accent" type="color" value="#7c5cff" />
            </div>
          </div>
          <div class="field">
            <label for="tagline">Krótki opis</label>
            <input id="tagline" name="tagline" placeholder="Jedno zdanie" />
          </div>
          <div class="field">
            <label for="description">Opis</label>
            <textarea id="description" name="description" placeholder="Dłuższy opis (opcjonalnie)"></textarea>
          </div>
          <div class="field">
            <label for="url">Link *</label>
            <input id="url" name="url" type="url" required placeholder="https://..." />
          </div>
          <div class="row2">
            <div class="field">
              <label for="installs">Pobrania / gwiazdki</label>
              <input id="installs" name="installs" type="number" min="0" value="0" />
            </div>
            <div class="field">
              <label for="rating">Ocena (0-5)</label>
              <input id="rating" name="rating" type="number" min="0" max="5" step="0.1" value="5" />
            </div>
          </div>
          <div class="field" style="flex-direction: row; align-items: center; gap: 10px">
            <input id="featured" name="featured" type="checkbox" style="width: auto" />
            <label for="featured" style="margin: 0">Wyróżniony</label>
          </div>
          <button class="btn" type="submit" id="add-btn">
            <span class="material-icons">add</span> Dodaj projekt
          </button>
          <p class="note" id="add-note" role="status" aria-live="polite"></p>
        </form>
      </section>

      <section class="panel glass" id="list-panel">
        <h2 class="panel__title">Twoje projekty</h2>
        <p class="panel__sub" id="list-sub"></p>
        <ul class="list" id="list"></ul>
      </section>
    </div>
  </body>
</html>
