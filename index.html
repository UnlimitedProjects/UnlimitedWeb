<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="view-transition" content="same-origin" />
    <title>UnlimitedWeb — hub projektów</title>
    <meta name="description" content="Odkrywaj prawdziwe projekty open source i projekt GitHub dnia." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css" />
    <script type="module" src="./main.js"></script>
  </head>
  <body>
    <a class="skip" href="#content">Pomiń do treści</a>
    <div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div>

    <header class="appbar">
      <div class="appbar__bar">
        <a class="logo" href="#" aria-label="UnlimitedWeb">
          <svg class="logo__svg" viewBox="0 0 40 40" aria-hidden="true">
            <path d="M6 3.5 30.5 20 6 36.5Z" fill="#01875f" />
            <path d="M6 3.5 21.8 19.3 30.5 20 6 3.5Z" fill="#00c389" />
            <path d="M6 36.5 21.8 20.7 30.5 20 6 36.5Z" fill="#00a173" />
            <path d="M30.5 20 36.6 16.6c1.1.6 1.1 2.2 0 2.8Z" fill="#ffce00" />
          </svg>
          <span class="logo__name">UnlimitedWeb</span>
        </a>

        <form class="searchbar glass" role="search" onsubmit="return false">
          <span class="material-icons searchbar__icon" aria-hidden="true">search</span>
          <input class="searchbar__input" id="search" type="search" placeholder="Szukaj projektów" aria-label="Szukaj projektów" autocomplete="off" />
        </form>

        <div class="appbar__actions">
          <button class="gicon" id="theme-toggle" type="button" aria-label="Zmień motyw">
            <span class="material-icons" aria-hidden="true">brightness_6</span>
          </button>
          <button class="gicon gicon--avatar" type="button" aria-label="Konto"><span class="avatar" aria-hidden="true">U</span></button>
        </div>
      </div>

      <nav class="tabs" aria-label="Sekcje">
        <div class="tabs__track" id="tabs"></div>
      </nav>
    </header>

    <main id="content">
      <div class="filters">
        <div class="filters__track" id="filters"></div>
      </div>

      <section class="hero-wrap" id="hero" aria-label="Projekt GitHub dnia"></section>
      <div id="shelves"></div>
    </main>

    <footer class="foot">
      <span class="foot__logo" aria-hidden="true">
        <svg viewBox="0 0 40 40" width="20" height="20">
          <path d="M6 3.5 30.5 20 6 36.5Z" fill="#01875f" />
          <path d="M30.5 20 36.6 16.6c1.1.6 1.1 2.2 0 2.8Z" fill="#ffce00" />
        </svg>
      </span>
      <span>UnlimitedWeb — dane z GitHub API</span>
    </footer>
  </body>
</html>
