<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>UnlimitedWeb — hub projektów</title>
    <meta name="description" content="Przeglądaj i odkrywaj projekty. Aplikacje, gry, narzędzia i strony w jednym miejscu." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
    <script type="module" src="./main.js"></script>
  </head>
  <body>
    <a class="skip" href="#catalog">Pomiń do katalogu</a>

    <header class="topbar">
      <div class="topbar__inner">
        <a class="brand" href="#" aria-label="UnlimitedWeb — strona główna">
          <span class="brand__mark" aria-hidden="true">U</span>
          <span class="brand__name">Unlimited<b>Web</b></span>
        </a>

        <form class="search" role="search" onsubmit="return false">
          <svg class="search__icon" viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M10 4a6 6 0 1 0 3.9 10.56l4.27 4.27 1.41-1.41-4.27-4.27A6 6 0 0 0 10 4Zm0 2a4 4 0 1 1 0 8 4 4 0 0 1 0-8Z"
            />
          </svg>
          <input
            class="search__input"
            id="search"
            type="search"
            placeholder="Szukaj projektów"
            aria-label="Szukaj projektów"
            autocomplete="off"
          />
        </form>

        <button class="iconbtn" id="theme-toggle" type="button" aria-label="Zmień motyw">
          <svg viewBox="0 0 24 24" aria-hidden="true" class="iconbtn__sun">
            <path
              d="M12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10Zm0-5h0a1 1 0 0 1 1 1v2a1 1 0 0 1-2 0V3a1 1 0 0 1 1-1Zm0 16a1 1 0 0 1 1 1v2a1 1 0 0 1-2 0v-2a1 1 0 0 1 1-1ZM4 11h2a1 1 0 0 1 0 2H4a1 1 0 0 1 0-2Zm14 0h2a1 1 0 0 1 0 2h-2a1 1 0 0 1 0-2ZM6.3 4.9l1.4 1.4a1 1 0 0 1-1.4 1.4L4.9 6.3A1 1 0 0 1 6.3 4.9Zm10 10 1.4 1.4a1 1 0 0 1-1.4 1.4l-1.4-1.4a1 1 0 0 1 1.4-1.4Zm1.4-10a1 1 0 0 1 0 1.4l-1.4 1.4A1 1 0 0 1 15 6.3l1.4-1.4a1 1 0 0 1 1.3 0Zm-10 10a1 1 0 0 1 0 1.4L6.3 17.7a1 1 0 0 1-1.4-1.4l1.4-1.4a1 1 0 0 1 1.4 0Z"
            />
          </svg>
          <svg viewBox="0 0 24 24" aria-hidden="true" class="iconbtn__moon">
            <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z" />
          </svg>
        </button>
      </div>

      <nav class="chips" aria-label="Kategorie">
        <div class="chips__track" id="chips"></div>
      </nav>
    </header>

    <main id="catalog">
      <section class="featured" id="featured" aria-label="Wyróżniony projekt"></section>

      <section class="row" aria-labelledby="reco-title">
        <div class="row__head">
          <h2 class="row__title" id="reco-title">Polecane dla Ciebie</h2>
        </div>
        <div class="shelf" id="shelf" role="list"></div>
      </section>

      <section class="row" aria-labelledby="all-title">
        <div class="row__head">
          <h2 class="row__title" id="all-title">Wszystkie projekty</h2>
          <span class="row__count" id="result-count" aria-live="polite"></span>
        </div>
        <div class="grid" id="grid" role="list"></div>
        <p class="empty" id="empty" hidden>Nic nie znaleziono. Zmień frazę lub kategorię.</p>
      </section>
    </main>

    <footer class="foot">
      <span class="brand__mark brand__mark--sm" aria-hidden="true">U</span>
      <span>UnlimitedWeb — hub projektów</span>
    </footer>
  </body>
</html>
