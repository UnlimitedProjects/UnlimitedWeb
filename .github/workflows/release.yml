name: Release site

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag do wydania (np. v1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package static site
        run: |
          mkdir -p dist
          rsync -a --exclude '.git' --exclude '.github' --exclude 'dist' ./ dist/unlimitedweb/ || \
          cp -r $(ls -A | grep -vE '^(\.git|\.github|dist)$') dist/unlimitedweb/
          cd dist && zip -r unlimitedweb-site.zip unlimitedweb

      - name: Create / update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || inputs.tag }}
          name: UnlimitedWeb ${{ github.ref_name || inputs.tag }}
          generate_release_notes: true
          files: dist/unlimitedweb-site.zip
